# =============================================================================
# kube-prometheus-stack values for the dev k3s environment
# =============================================================================
# Components: Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics
# StorageClass: local-path
# =============================================================================

grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  ingress:
    enabled: false

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

  # Loki는 on-demand(apps-ondemand/, ADR-0004)라 평소엔 미가동.
  # 데이터소스 배선은 유지해 Loki를 띄우면 추가 설정 없이 바로 연결됩니다.
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://platform-monitoring-loki-gateway.platform-monitoring.svc.cluster.local
      editable: true
      isDefault: false
      jsonData:
        manageAlerts: false

prometheus:
  prometheusSpec:
    # 12GB 단일 노드 리핏(ADR-0004): retention/메모리/스토리지를 축소.
    # 메트릭은 lean하게 상시 가동(라이브 모니터링 유지), 로그(Loki/Alloy)는 on-demand.
    retention: 5d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
