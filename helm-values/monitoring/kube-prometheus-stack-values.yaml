# =============================================================================
# kube-prometheus-stack values for the dev k3s environment
# =============================================================================
# Components: Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics
# StorageClass: local-path
# =============================================================================

grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  # Grafana가 첫 기동 후 만드는 png/pdf/csv(472 소유, 0700)를 init-chown-data(root,
  # capabilities drop ALL이라 DAC_OVERRIDE 없음)가 순회하지 못해 두 번째 롤아웃부터
  # 전부 교착된다. 소유권은 첫 기동에 이미 확정되고 local-path는 0777로 프로비저닝
  # 하므로 chown 자체가 불필요 — init을 끄는 쪽이 권한 추가보다 안전하다.
  initChownData:
    enabled: false

  # RWO PVC + SQLite(grafana.db)는 롤링 중 신구 pod가 동시에 마운트하는 것 자체가
  # 위험하다(단일 노드라 마운트는 성공해버림). 구 pod 종료 후 기동으로 강제.
  # 트레이드오프: 롤아웃마다 수십 초 다운 — 단독 운영이라 수용.
  # RollingUpdate→Recreate 전이는 병합 계열 apply로 불가능했다(SSA는 null을 필드 삭제로
  # 안 봄 → rollingUpdate 잔존 Forbidden, CSA는 last-applied 부재로 스테일 initContainers
  # 미삭제). 1회성 Replace=true 어노테이션으로 전이 완료 후 SSA 복귀함 (PR #10~#11, 2026-07-05).
  deploymentStrategy:
    type: Recreate

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - aporiax.duckdns.org
    tls:
      - secretName: grafana-tls
        hosts:
          - aporiax.duckdns.org
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt-prod

  # OIDC client secret은 SealedSecret(grafana-oidc-secret)의 env로 주입 —
  # GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET 환경변수가 grafana.ini 값을 대체하므로
  # ini에는 client_secret을 두지 않는다 (Git 평문 금지).
  envFromSecret: grafana-oidc-secret

  grafana.ini:
    server:
      # OAuth redirect 생성에 필수 — ingress 도메인과 일치해야 함
      root_url: https://aporiax.duckdns.org
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      # platform realm 사용자는 최소 Viewer로 자동 가입 허용 (realm 자체가 사내 경계)
      allow_sign_up: true
      client_id: grafana
      scopes: openid email profile
      auth_url: https://aporiax-auth.duckdns.org/realms/platform/protocol/openid-connect/auth
      token_url: https://aporiax-auth.duckdns.org/realms/platform/protocol/openid-connect/token
      api_url: https://aporiax-auth.duckdns.org/realms/platform/protocol/openid-connect/userinfo
      use_pkce: true
      # realm role → Grafana role 매핑 (client의 realm-roles mapper가 id_token/userinfo에
      # realm_access.roles를 노출해야 동작 — kcadm 셋업 스크립트가 생성함)
      role_attribute_path: contains(realm_access.roles[*], 'platform-admin') && 'Admin' || contains(realm_access.roles[*], 'platform-operator') && 'Editor' || 'Viewer'

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

  # Loki는 on-demand(apps-ondemand/, ADR-0004)라 평소엔 미가동.
  # 데이터소스 배선은 유지해 Loki를 띄우면 추가 설정 없이 바로 연결됩니다.
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://platform-monitoring-loki-gateway.platform-monitoring.svc.cluster.local
      editable: true
      isDefault: false
      jsonData:
        manageAlerts: false

prometheus:
  prometheusSpec:
    # 12GB 단일 노드 리핏(ADR-0004): retention/메모리/스토리지를 축소.
    # 메트릭은 lean하게 상시 가동(라이브 모니터링 유지), 로그(Loki/Alloy)는 on-demand.
    retention: 5d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

    # 텔레그램 봇 토큰(SealedSecret alertmanager-telegram-token)을 파드에
    # /etc/alertmanager/secrets/alertmanager-telegram-token/token 으로 마운트.
    # 토큰 자체는 git에 없고 이 파일 경로만 config가 참조한다(bot_token_file).
    secrets:
      - alertmanager-telegram-token

  # Helm은 values를 맵 단위로 병합하므로 route/receivers만 지정하면 그 두 키만
  # 차트 기본값을 대체하고, 여기서 안 건드린 inhibit_rules(critical이 같은
  # namespace+alertname의 warning/info를 억제)·templates는 차트 기본값이 그대로
  # 살아있다 — 직접 재작성할 필요 없음(차트 기본 확인: kube-prometheus-stack
  # 83.6.0 values.yaml).
  # chat_id는 토큰 없이는 무의미한 숫자라 git 평문으로 둬도 안전 — 비밀은
  # 토큰 파일 하나로 격리했다.
  # Watchdog은 파이프라인 생존 확인용 상시 firing 메타 알림이라 텔레그램으로
  # 보내면 repeat_interval마다 영구 노이즈가 된다 → null 라우팅으로 명시 유지.
  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: telegram-platform
      group_by: ['alertname', 'namespace']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - receiver: 'null'
          matchers:
            - alertname = "Watchdog"
    receivers:
      - name: 'null'
      - name: telegram-platform
        telegram_configs:
          - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram-token/token
            chat_id: 5414451219
            send_resolved: true

# admission webhook TLS를 helm hook Job(create/patch) 대신 cert-manager로 발급.
# hook 방식은 SA/RBAC에 pre+post 훅 4종이 달려 ArgoCD 훅 엔진이 완료 판정을 못 하고
# sync가 교착된다(2026-07-05 실측: Job Complete 후 SA hookPhase=Running 고착).
# cert-manager는 wave 0에서 이미 상시 가동 중 — 훅 리소스 자체를 제거하는 정석 경로.
prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
