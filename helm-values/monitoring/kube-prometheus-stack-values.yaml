# =============================================================================
# kube-prometheus-stack values for the dev k3s environment
# =============================================================================
# Components: Prometheus, Grafana, Alertmanager, node-exporter, kube-state-metrics
# StorageClass: local-path
# =============================================================================

grafana:
  admin:
    existingSecret: grafana-admin-secret
    userKey: admin-user
    passwordKey: admin-password

  persistence:
    enabled: true
    storageClassName: local-path
    accessModes:
      - ReadWriteOnce
    size: 10Gi

  # Grafana가 첫 기동 후 만드는 png/pdf/csv(472 소유, 0700)를 init-chown-data(root,
  # capabilities drop ALL이라 DAC_OVERRIDE 없음)가 순회하지 못해 두 번째 롤아웃부터
  # 전부 교착된다. 소유권은 첫 기동에 이미 확정되고 local-path는 0777로 프로비저닝
  # 하므로 chown 자체가 불필요 — init을 끄는 쪽이 권한 추가보다 안전하다.
  initChownData:
    enabled: false

  # RWO PVC + SQLite(grafana.db)는 롤링 중 신구 pod가 동시에 마운트하는 것 자체가
  # 위험하다(단일 노드라 마운트는 성공해버림). 구 pod 종료 후 기동으로 강제.
  # 트레이드오프: 롤아웃마다 수십 초 다운 — 단독 운영이라 수용.
  # RollingUpdate→Recreate 전이는 병합 계열 apply로 불가능했다(SSA는 null을 필드 삭제로
  # 안 봄 → rollingUpdate 잔존 Forbidden, CSA는 last-applied 부재로 스테일 initContainers
  # 미삭제). 1회성 Replace=true 어노테이션으로 전이 완료 후 SSA 복귀함 (PR #10~#11, 2026-07-05).
  deploymentStrategy:
    type: Recreate

  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
      - aporiax.duckdns.org
    tls:
      - secretName: grafana-tls
        hosts:
          - aporiax.duckdns.org
    annotations:
      traefik.ingress.kubernetes.io/router.entrypoints: websecure
      cert-manager.io/cluster-issuer: letsencrypt-prod

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  sidecar:
    dashboards:
      enabled: true
      searchNamespace: ALL

  # Loki는 on-demand(apps-ondemand/, ADR-0004)라 평소엔 미가동.
  # 데이터소스 배선은 유지해 Loki를 띄우면 추가 설정 없이 바로 연결됩니다.
  additionalDataSources:
    - name: Loki
      uid: loki
      type: loki
      access: proxy
      url: http://platform-monitoring-loki-gateway.platform-monitoring.svc.cluster.local
      editable: true
      isDefault: false
      jsonData:
        manageAlerts: false

prometheus:
  prometheusSpec:
    # 12GB 단일 노드 리핏(ADR-0004): retention/메모리/스토리지를 축소.
    # 메트릭은 lean하게 상시 가동(라이브 모니터링 유지), 로그(Loki/Alloy)는 on-demand.
    retention: 5d

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: "1"
        memory: 1Gi

    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

alertmanager:
  alertmanagerSpec:
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# admission webhook TLS를 helm hook Job(create/patch) 대신 cert-manager로 발급.
# hook 방식은 SA/RBAC에 pre+post 훅 4종이 달려 ArgoCD 훅 엔진이 완료 판정을 못 하고
# sync가 교착된다(2026-07-05 실측: Job Complete 후 SA hookPhase=Running 고착).
# cert-manager는 wave 0에서 이미 상시 가동 중 — 훅 리소스 자체를 제거하는 정석 경로.
prometheusOperator:
  admissionWebhooks:
    certManager:
      enabled: true

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

defaultRules:
  create: true
  rules:
    etcd: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false

kubeControllerManager:
  enabled: false

kubeScheduler:
  enabled: false

kubeEtcd:
  enabled: false

kubeProxy:
  enabled: false
