global:
  postgresql:
    auth:
      existingSecret: "postgres-db-secret"
      secretKeys:
        adminPasswordKey: "postgres-password"
        userPasswordKey: "keycloak-password"
      database: "keycloak_db"
      username: "keycloak_admin"
  security:
    # bitnamilegacy 레포 이미지를 쓰기 위한 chart 검증 게이트 해제
    allowInsecureImages: true
# ---------------------------------------------------------------------------
# 이미지 고정 (Bitnami 카탈로그 개편 대응)
# ---------------------------------------------------------------------------
# chart 18.5.19의 기본 이미지는 docker.io/bitnami/postgresql:latest로
# 버전이 고정되지 않아 재구축 시마다 다른 PG 메이저가 뜰 수 있습니다.
# bitnamilegacy의 마지막 고정 태그(PG 17.6)로 핀 고정합니다.
# 주의: bitnami/postgresql:latest(PG 18.x)로 초기화된 기존 data 디렉토리에는
#       이 이미지로 기동할 수 없음 — 빈 PVC에서 시작하는 clean install 전용.
# ---------------------------------------------------------------------------
image:
  registry: docker.io
  repository: bitnamilegacy/postgresql
  tag: 17.6.0-debian-12-r4
architecture: standalone
primary:
  persistence:
    existingClaim: postgres-pvc
  # ---------------------------------------------------------------------------
  # Harbor DB 초기화 스크립트
  # ---------------------------------------------------------------------------
  # PostgreSQL 최초 기동 시(data 디렉토리가 비어 있을 때) 자동 실행됩니다.
  # 이미 운영 중인 클러스터에는 영향 없으며, 신규 배포 환경 전용입니다.
  # IF NOT EXISTS 패턴으로 멱등성을 보장합니다.
  # ---------------------------------------------------------------------------
  initdb:
    scripts:
      init-harbor-db.sh: |
        #!/bin/bash
        set -euo pipefail
        echo "=== Harbor database initialization ==="
        export PGPASSWORD="$(cat /run/secrets/db/postgres-password)"
        HARBOR_DB_PASSWORD="$(cat /run/secrets/db/harbor-password)"

        psql -v ON_ERROR_STOP=1 \
          --username "postgres" \
          --dbname "postgres" \
          --set harbor_password="${HARBOR_DB_PASSWORD}" <<-'EOSQL'
          SELECT format('CREATE ROLE harbor_admin WITH LOGIN PASSWORD %L', :'harbor_password')
          WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'harbor_admin')\gexec

          ALTER ROLE harbor_admin WITH LOGIN PASSWORD :'harbor_password';

          SELECT 'CREATE DATABASE harbor_registry OWNER harbor_admin'
          WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'harbor_registry')\gexec

          GRANT ALL PRIVILEGES ON DATABASE harbor_registry TO harbor_admin;
        EOSQL
        unset PGPASSWORD
        echo "=== Harbor database initialization complete ==="
  extraVolumes:
    - name: db-secrets
      secret:
        secretName: postgres-db-secret
  extraVolumeMounts:
    - name: db-secrets
      mountPath: /run/secrets/db
      readOnly: true
volumePermissions:
  enabled: true
  image:
    registry: docker.io
    repository: bitnamilegacy/os-shell
    tag: 12-debian-12-r51

