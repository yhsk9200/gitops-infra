# =============================================================================
# Keycloak values for the current dev/internal environment
# =============================================================================
# Purpose:
# - Run Keycloak without a public domain.
# - Access the admin console with kubectl port-forward when needed.
# - Keep URL-dependent settings loose until the real domain/TLS plan is ready.
# =============================================================================

global:
  security:
    # The current environment uses the bitnamilegacy image repository.
    allowInsecureImages: true

image:
  registry: docker.io
  repository: bitnamilegacy/keycloak
  tag: 26.3.3-debian-12-r0

auth:
  adminUser: admin
  existingSecret: keycloak-admin-secret
  passwordSecretKey: admin-password

postgresql:
  enabled: false

externalDatabase:
  host: platform-db-postgres-postgresql.platform-db.svc.cluster.local
  port: 5432
  user: keycloak_admin
  database: keycloak_db
  existingSecret: keycloak-db-secret
  existingSecretPasswordKey: keycloak-password

# Dev mode: keep hostname checks relaxed until a stable external domain exists.
production: false
proxyHeaders: ""
hostnameStrict: false
httpEnabled: true

ingress:
  enabled: false

automountServiceAccountToken: false

serviceAccount:
  create: true
  automountServiceAccountToken: false

replicaCount: 1

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: "1"
    memory: 1Gi

logging:
  output: default
  level: INFO

metrics:
  enabled: false
  serviceMonitor:
    enabled: false

# Keep this disabled until the initial realm/client/role model is agreed.
keycloakConfigCli:
  enabled: false

# The chart default is permissive, but we keep it explicit for handover.
# Tighten this only after the cluster CNI and required traffic paths are verified.
networkPolicy:
  enabled: true
  allowExternal: true
  allowExternalEgress: true
