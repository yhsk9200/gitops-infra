apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-iam-keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-infra
  sources:
    - repoURL: https://charts.bitnami.com/bitnami
      chart: keycloak
      targetRevision: "25.2.0"
      helm:
        valueFiles:
          - $values/helm-values/iam/keycloak-values-dev.yaml
    - repoURL: https://gitlab.am.micube.dev/daegu-tp/mfg-data-platform/gitops/platform-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-iam
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
