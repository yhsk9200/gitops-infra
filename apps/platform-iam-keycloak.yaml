apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-iam-keycloak
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: platform-infra
  sources:
    # charts.bitnami.com은 2025-08 Bitnami 카탈로그 개편 이후 폐쇄됨(403) — OCI 경로 사용
    # oci:// 스킴 금지: ArgoCD 3.x 네이티브 OCI 경로가 chart명 누락된 digest 조회로 401 → 스킴 없이 + chart: 필드
    - repoURL: registry-1.docker.io/bitnamicharts
      chart: keycloak
      targetRevision: "25.2.0"
      helm:
        valueFiles:
          - $values/helm-values/iam/keycloak-values-prod.yaml
    - repoURL: https://github.com/yhsk9200/gitops-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-iam
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
