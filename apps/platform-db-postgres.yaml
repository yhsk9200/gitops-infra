apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-db-postgres
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: platform-infra
  sources:
    # charts.bitnami.com은 2025-08 Bitnami 카탈로그 개편 이후 폐쇄됨(403) — OCI 경로 사용
    - repoURL: "oci://registry-1.docker.io/bitnamicharts"
      chart: postgresql
      targetRevision: 18.5.19
      helm:
        valueFiles:
          - $values/helm-values/database/postgres-values.yaml
    - repoURL: "https://github.com/yhsk9200/gitops-infra.git"
      targetRevision: main
      ref: values
  destination:
    server: "https://kubernetes.default.svc"
    namespace: platform-db
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
