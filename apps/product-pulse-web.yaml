apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: product-pulse-web
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: product-pulse
  source:
    repoURL: https://github.com/yhsk9200/aporiax-pulse.git
    targetRevision: main
    path: deploy/manifests/web
  destination:
    server: https://kubernetes.default.svc
    namespace: product-pulse
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
