apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-registry-harbor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
spec:
  project: platform-infra
  sources:
    - repoURL: https://helm.goharbor.io
      chart: harbor
      targetRevision: 1.16.2
      helm:
        valueFiles:
          - $values/helm-values/registry/harbor-values.yaml
    - repoURL: https://github.com/yhsk9200/gitops-infra.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: platform-registry
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
