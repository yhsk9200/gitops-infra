apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-monitoring-rules
  namespace: argocd
  annotations:
    # PrometheusRule CRD는 wave 3(kube-prometheus-stack)에서 생성됨
    argocd.argoproj.io/sync-wave: "5"
spec:
  project: platform-infra
  source:
    repoURL: "https://github.com/yhsk9200/gitops-infra.git"
    targetRevision: main
    path: manifests/monitoring/rules
  destination:
    server: "https://kubernetes.default.svc"
    namespace: platform-monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
