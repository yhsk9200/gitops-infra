apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-root-infra
  namespace: argocd
spec:
  project: default
  source:
    repoURL: "https://gitlab.am.micube.dev/daegu-tp/mfg-data-platform/gitops/platform-infra.git"
    targetRevision: main
    path: apps
    directory:
      recurse: true
  destination:
    server: "https://kubernetes.default.svc"
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
