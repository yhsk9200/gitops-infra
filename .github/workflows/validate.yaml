name: validate

on:
  push:
    branches: [main]
  # No paths filter: these jobs are required status checks on main (branch
  # protection). A path-filtered PR (e.g. docs/ADR/CLAUDE.md only) would skip
  # the workflow, leaving the required contexts perpetually pending and
  # blocking the merge — the classic GitHub "required + path filter" deadlock.
  # Running validate on every PR (~2 min) is the cost of making it a gate.
  pull_request:

env:
  KUBECONFORM_VERSION: v0.6.7
  KUBE_VERSION: "1.32.0"

jobs:
  kubeconform:
    name: kubeconform (raw manifests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      # CRD(Application/AppProject/SealedSecret/PrometheusRule) 스키마는
      # datree CRDs-catalog에서 가져온다. 카탈로그에 없는 스키마만 스킵.
      - name: Validate apps/ apps-ondemand/ bootstrap/ manifests/
        run: |
          kubeconform -strict -summary \
            -kubernetes-version "${KUBE_VERSION}" \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -ignore-missing-schemas \
            apps/ apps-ondemand/ bootstrap/ manifests/

  helm-render:
    name: helm template (pinned charts x values)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin kubeconform

      # ArgoCD Application과 동일한 (chart, version, values) 조합을 렌더링해
      # values 파일이 차트와 어긋나는 변경을 push 전에 잡는다.
      # release 이름은 실제 ArgoCD app 이름과 동일하게 두어 fullname 파생
      # 리소스 이름(platform-db-postgres-postgresql 등)까지 동일 조건으로 검증한다.
      - name: Render all charts with repo values
        run: |
          set -euo pipefail
          render() {
            local release="$1" chart="$2" version="$3" values="$4"
            shift 4
            echo "::group::${release} (${chart} ${version})"
            helm template "${release}" "${chart}" \
              --version "${version}" -f "${values}" \
              --kube-version "${KUBE_VERSION}" "$@" \
              | kubeconform -summary -ignore-missing-schemas \
                  -kubernetes-version "${KUBE_VERSION}" \
                  -schema-location default \
                  -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
            echo "::endgroup::"
          }

          render platform-db-postgres oci://registry-1.docker.io/bitnamicharts/postgresql 18.5.19 helm-values/database/postgres-values.yaml -n platform-db
          render platform-iam-keycloak oci://registry-1.docker.io/bitnamicharts/keycloak 25.2.0 helm-values/iam/keycloak-values-dev.yaml -n platform-iam
          render platform-iam-keycloak-prod oci://registry-1.docker.io/bitnamicharts/keycloak 25.2.0 helm-values/iam/keycloak-values-prod.yaml -n platform-iam
          render platform-system-sealed-secrets sealed-secrets 2.18.4 helm-values/system/sealed-secrets-values.yaml -n platform-system --repo https://bitnami.github.io/sealed-secrets
          render platform-monitoring-prometheus kube-prometheus-stack 83.6.0 helm-values/monitoring/kube-prometheus-stack-values.yaml -n platform-monitoring --repo https://prometheus-community.github.io/helm-charts
          render platform-monitoring-loki loki 6.46.0 helm-values/monitoring/loki-values.yaml -n platform-monitoring --repo https://grafana.github.io/helm-charts
          render platform-monitoring-alloy alloy 1.7.0 helm-values/monitoring/alloy-values.yaml -n platform-monitoring --repo https://grafana.github.io/helm-charts

  arm64-manifest:
    name: arm64 manifest (pinned images)
    runs-on: ubuntu-latest
    steps:
      # ADR-0006 regression guard: goharbor shipped amd64-only and could not
      # start on the arm64 node — the mismatch surfaced only at deploy time.
      # Every image we explicitly pin (helm-values/ or manifests/) must expose
      # a linux/arm64 manifest. Keep this list in sync with the pinned tags
      # (change both in the same PR when a pin moves).
      - name: Assert linux/arm64 for every pinned image
        run: |
          set -uo pipefail
          IMAGES=(
            "docker.io/bitnamilegacy/keycloak:26.3.3-debian-12-r0"     # helm-values/iam/keycloak-values-{prod,dev}.yaml
            "docker.io/bitnamilegacy/postgresql:17.6.0-debian-12-r4"   # helm-values/database/postgres-values.yaml + manifests/backup (pg_dump 버전을 서버와 맞춤 — 옮길 때 두 곳 함께)
            "docker.io/bitnamilegacy/os-shell:12-debian-12-r51"        # helm-values/database/postgres-values.yaml (init/metrics)
            "ghcr.io/yhsk9200/mlflow:v3.6.0-pg1"                       # manifests/mlops/mlflow-deployment.yaml (선빌드 필요 — docs/platform-mlops-setup.md 7단계)
            "minio/mc:RELEASE.2025-08-13T08-35-41Z"                    # manifests/backup/platform-backup-cronjob.yaml (NAS 반출·checksum 재검증)
          )
          fail=0
          for img in "${IMAGES[@]}"; do
            echo "::group::${img}"
            if inspect=$(docker buildx imagetools inspect "$img" 2>&1); then
              echo "$inspect"
              if grep -q "linux/arm64" <<<"$inspect"; then
                echo "OK: linux/arm64 present"
              else
                echo "::error::${img} has no linux/arm64 manifest"
                fail=1
              fi
            else
              echo "$inspect"
              echo "::error::failed to inspect ${img}"
              fail=1
            fi
            echo "::endgroup::"
          done
          exit "$fail"
