# HTTP-01: Traefik(k3s 기본 ingress controller)가 이미 80/443을 서빙하므로
# DNS-01(DuckDNS API 토큰 관리)보다 단순한 challenge 방식을 택한다.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: yhsk9200@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: traefik
