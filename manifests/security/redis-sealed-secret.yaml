# ⚠️ 재암호화 필요: strict scope로 암호화되어 있으므로
# namespace 변경 후 아래 명령어로 재암호화가 필요합니다:
# kubeseal --format=yaml --re-encrypt < redis-sealed-secret.yaml > redis-sealed-secret-new.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: redis-secret
  namespace: platform-db
spec:
  encryptedData:
    redis-password: 
  template:
    metadata:
      name: redis-secret
      namespace: platform-db
