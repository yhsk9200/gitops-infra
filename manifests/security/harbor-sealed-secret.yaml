# =============================================================================
# Harbor SealedSecrets
# =============================================================================
# Re-encrypt these secrets with the target cluster certificate before applying.
#
# Example commands:
#
# 1. Harbor admin password
# kubectl create secret generic harbor-admin-secret \
#   --namespace=platform-registry \
#   --from-literal=admin-password='YOUR_UI_PASSWORD' \
#   --dry-run=client -o yaml | \
#   kubeseal --cert pub-cert.pem --format=yaml > manifests/security/harbor-sealed-secret.yaml
#
# 2. Harbor encryption key (must be 16 chars)
# kubectl create secret generic harbor-core-secret \
#   --namespace=platform-registry \
#   --from-literal=secretKey='aVerySecureRandomString16chars!' \
#   --dry-run=client -o yaml | \
#   kubeseal --cert pub-cert.pem --format=yaml >> manifests/security/harbor-sealed-secret.yaml
#
# 3. Harbor external PostgreSQL user password
# kubectl create secret generic harbor-db-secret \
#   --namespace=platform-registry \
#   --from-literal=password='YOUR_DB_PASSWORD' \
#   --dry-run=client -o yaml | \
#   kubeseal --cert pub-cert.pem --format=yaml >> manifests/security/harbor-sealed-secret.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-admin-secret
  namespace: platform-registry
spec:
  encryptedData:
    admin-password: 
  template:
    metadata:
      name: harbor-admin-secret
      namespace: platform-registry
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-core-secret
  namespace: platform-registry
spec:
  encryptedData:
    secretKey: 
  template:
    metadata:
      name: harbor-core-secret
      namespace: platform-registry
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-db-secret
  namespace: platform-registry
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: harbor-db-secret
      namespace: platform-registry
