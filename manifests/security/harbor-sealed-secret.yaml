# =============================================================================
# Harbor SealedSecrets 템플릿
# =============================================================================
# ⚠️ 주의: 반드시 이 템플릿을 수정하여 사용자의 인증서로 재암호화하세요.
#
# 재암호화 필수 명령어 모음:
#
# 1. UI 관리자 비밀번호
# kubectl create secret generic harbor-admin-secret \
#   --namespace=platform-registry \
#   --from-literal=admin-password='YOUR_UI_PASSWORD' \
#   --dry-run=client -o yaml | \
#   kubeseal --cert pub-cert.pem --format=yaml > manifests/security/harbor-sealed-secret.yaml
#
# 2. 내부 통신 암호키 (최소 16자리 무작위 권장)
# kubectl create secret generic harbor-core-secret \
#   --namespace=platform-registry \
#   --from-literal=secret-key='aVerySecureRandomString16chars!' \
#   --dry-run=client -o yaml | \
#   kubeseal --cert pub-cert.pem --format=yaml >> manifests/security/harbor-sealed-secret.yaml
#
# 3. 내부 Postgres DB 비밀번호
# kubectl create secret generic harbor-db-secret \
#   --namespace=platform-registry \
#   --from-literal=password='YOUR_DB_PASSWORD' \
#   --dry-run=client -o yaml | \
#   kubeseal --cert pub-cert.pem --format=yaml >> manifests/security/harbor-sealed-secret.yaml
# -------------------------------------------------------------

# 1. UI 화면 관리자 비밀번호 (Admin password)
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-admin-secret
  namespace: platform-registry
spec:
  encryptedData:
    admin-password: 
  template:
    metadata:
      name: harbor-admin-secret
      namespace: platform-registry
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-core-secret
  namespace: platform-registry
spec:
  encryptedData:
    secret-key: 
  template:
    metadata:
      name: harbor-core-secret
      namespace: platform-registry
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: harbor-db-secret
  namespace: platform-registry
spec:
  encryptedData:
    password: 
  template:
    metadata:
      name: harbor-db-secret
      namespace: platform-registry
