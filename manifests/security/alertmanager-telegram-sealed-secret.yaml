# =============================================================================
# Alertmanager Telegram bot token SealedSecret
# =============================================================================
# 이 Secret에는 다음 키가 포함되어야 합니다:
#   - token : Telegram Bot API 토큰 (@BotFather 발급). alertmanagerSpec.secrets로
#     마운트되어 helm-values/monitoring/kube-prometheus-stack-values.yaml의
#     alertmanager.config가 bot_token_file로 참조한다.
#
# chat_id는 토큰 없이는 무의미한 숫자라 values.yaml에 git 평문으로 둔다(비밀 아님).
#
# 값 회전 시: @BotFather에서 새 토큰 발급 → 아래 명령으로 reseal → 커밋.
#
#   kubectl create secret generic alertmanager-telegram-token \
#     --namespace=platform-monitoring \
#     --from-literal=token='<BOT_TOKEN>' \
#     --dry-run=client -o yaml | \
#     kubeseal --cert pub-cert.pem --format=yaml \
#       > manifests/security/alertmanager-telegram-sealed-secret.yaml
# =============================================================================

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: alertmanager-telegram-token
  namespace: platform-monitoring
spec:
  encryptedData:
    token: 
  template:
    metadata:
      name: alertmanager-telegram-token
      namespace: platform-monitoring
