# =============================================================================
# PostgreSQL SealedSecret
# =============================================================================
# 이 Secret에는 다음 키가 포함되어야 합니다:
#   - postgres-password  : PostgreSQL superuser 비밀번호
#   - keycloak-password  : keycloak_admin 유저 비밀번호
#                          (keycloak-db-secret@platform-iam 의 keycloak-password 와 동일 값)
#   - harbor-password    : harbor_admin 유저 비밀번호 (initdb 스크립트에서 사용)
#                          (harbor-db-secret@platform-registry 의 password 와 동일 값)
#
# 신규 클러스터 배포 시 아래 명령어로 재생성하세요:
#
#   kubectl create secret generic postgres-db-secret \
#     --namespace=platform-db \
#     --from-literal=postgres-password='<POSTGRES_PW>' \
#     --from-literal=keycloak-password='<KEYCLOAK_PW>' \
#     --from-literal=harbor-password='<HARBOR_PW>' \
#     --dry-run=client -o yaml | \
#     kubeseal --cert pub-cert.pem --format=yaml \
#       > manifests/security/postgres-sealed-secret.yaml
# =============================================================================

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-db-secret
  namespace: platform-db
spec:
  encryptedData:
    harbor-password: 
    keycloak-password: 
    postgres-password: 
  template:
    metadata:
      name: postgres-db-secret
      namespace: platform-db
