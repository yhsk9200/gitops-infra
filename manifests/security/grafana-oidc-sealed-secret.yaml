# =============================================================================
# Grafana OIDC client secret SealedSecret
# =============================================================================
# 이 Secret에는 다음 키가 포함되어야 합니다:
#   - GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET : Keycloak platform realm의
#     `grafana` client secret (env로 주입되어 grafana.ini의 client_secret을 대체)
#
# Keycloak 쪽 값과 반드시 동일해야 합니다 (clients/grafana의 Credentials).
# 값 회전 시: Keycloak에서 새 secret 설정 → 아래 명령으로 reseal → 커밋.
#
# 신규 클러스터 배포 시 아래 명령어로 재생성하세요:
#
#   kubectl create secret generic grafana-oidc-secret \
#     --namespace=platform-monitoring \
#     --from-literal=GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET='<CLIENT_SECRET>' \
#     --dry-run=client -o yaml | \
#     kubeseal --cert pub-cert.pem --format=yaml \
#       > manifests/security/grafana-oidc-sealed-secret.yaml
# =============================================================================

---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: grafana-oidc-secret
  namespace: platform-monitoring
spec:
  encryptedData:
    GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: 
  template:
    metadata:
      name: grafana-oidc-secret
      namespace: platform-monitoring
