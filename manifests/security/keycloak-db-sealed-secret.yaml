# ⚠️ 재암호화 필요: strict scope로 암호화되어 있으므로
# namespace 변경 후 아래 명령어로 재암호화가 필요합니다:
# kubeseal --format=yaml --re-encrypt < keycloak-db-sealed-secret.yaml > keycloak-db-sealed-secret-new.yaml
#
# Keycloak이 platform-iam 네임스페이스에서 PostgreSQL(platform-db)에 접속하기 위한
# DB 비밀번호 Secret. cross-namespace Secret 참조가 불가능하므로 별도 생성.
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: keycloak-db-secret
  namespace: platform-iam
spec:
  encryptedData:
    # keycloak-password: 재암호화 후 교체 필요 (postgres-db-secret의 keycloak-password와 동일 값)
    keycloak-password: PLACEHOLDER_REQUIRE_RE_ENCRYPTION
  template:
    metadata:
      name: keycloak-db-secret
      namespace: platform-iam
