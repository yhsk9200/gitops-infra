# Ingress 없음 — ADR-0008의 MLflow UI 비노출 결정(터널/tailnet 전용).
# ArgoCD/Prometheus/Alertmanager와 동일하게 컨트롤 플레인성 UI는 외부에
# 노출하지 않는다. 접근은 `kubectl port-forward svc/mlflow -n platform-mlops
# 5000:5000`, 또는 tailnet 경유 NodePort 30500(노드 100.69.52.25:30500).
# NodePort는 공인 노출이 아님 — OCI Security List가 30500 인바운드를 차단하고
# tailnet 인바운드만 tailscale0로 들어온다(ADR-0009 연결 계약 ③, Mac 실험
# 클러스터의 eval 잡이 이 경로로 MLflow에 기록).
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: platform-mlops
  labels:
    app.kubernetes.io/name: mlflow
    app.kubernetes.io/part-of: platform-infra
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: mlflow
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30500
