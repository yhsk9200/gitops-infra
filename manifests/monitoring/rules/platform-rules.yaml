# =============================================================================
# Platform v1 PrometheusRule
# =============================================================================
# 설계 원칙:
# - 특정 릴리스/리소스 이름에 핀 고정하지 않고 kube-state-metrics 기반의
#   제네릭 룰로 platform-* 네임스페이스 전체를 커버합니다.
#   (PostgreSQLDown/KeycloakDown/LokiDown 등 개별 후보 룰은
#    StatefulSetDegraded/DeploymentDegraded가 이름 독립적으로 포괄)
# - Alertmanager receiver/route는 알림 채널 확정 후 별도 작업
#   (docs/platform-alerting-todo.md 참조). 그 전까지는 Alertmanager UI에서
#   firing 여부를 확인합니다.
# - kube-prometheus-stack values에 ruleSelectorNilUsesHelmValues: false가
#   설정되어 있어 라벨 매칭 없이도 Prometheus가 이 룰을 로딩합니다.
# =============================================================================
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: platform-rules
  namespace: platform-monitoring
  labels:
    app.kubernetes.io/part-of: platform-infra
spec:
  groups:
    - name: platform.availability
      rules:
        - alert: PlatformPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace=~"platform-.*"}[15m]) > 3
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 재시작 반복"
            description: "컨테이너 {{ $labels.container }}가 최근 15분간 3회를 초과해 재시작했습니다."

        - alert: PlatformPodNotReady
          expr: sum by (namespace, pod) (kube_pod_status_phase{namespace=~"platform-.*", phase=~"Pending|Unknown|Failed"}) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} 비정상 phase"
            description: "Pod가 15분 이상 Pending/Unknown/Failed 상태입니다. 스케줄링 실패나 이미지 pull 실패 여부를 확인하세요."

        - alert: PlatformDeploymentDegraded
          expr: kube_deployment_status_replicas_available{namespace=~"platform-.*"} < kube_deployment_spec_replicas{namespace=~"platform-.*"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "Deployment {{ $labels.namespace }}/{{ $labels.deployment }} 가용 replica 부족"
            description: "10분 이상 available replica가 spec보다 적습니다. (Alloy, Grafana 등 포괄)"

        - alert: PlatformStatefulSetDegraded
          expr: kube_statefulset_status_replicas_ready{namespace=~"platform-.*"} < kube_statefulset_status_replicas{namespace=~"platform-.*"}
          for: 10m
          labels:
            severity: critical
          annotations:
            summary: "StatefulSet {{ $labels.namespace }}/{{ $labels.statefulset }} ready replica 부족"
            description: "10분 이상 ready replica가 부족합니다. (PostgreSQL, Keycloak, Prometheus 등 포괄. Loki는 on-demand 기동 시)"

    - name: platform.capacity
      rules:
        - alert: PlatformPVAlmostFull
          expr: kubelet_volume_stats_available_bytes{namespace=~"platform-.*"} / kubelet_volume_stats_capacity_bytes{namespace=~"platform-.*"} < 0.10
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "PVC {{ $labels.namespace }}/{{ $labels.persistentvolumeclaim }} 잔여 공간 10% 미만"
            description: "단일 노드 local-path 환경이므로 노드 디스크 고갈로 직결됩니다. 보존 기간/이미지 정리를 검토하세요."

    - name: platform.backup
      # 백업 자동화(in-cluster CronJob, 런북 §14)의 실패 감지. 조용히 실패하는
      # 백업은 없는 백업보다 나쁘다 — 있다고 믿게 만들기 때문이다.
      #
      # 핵심 룰은 실패 이벤트가 아니라 **staleness**다. 잡 실패·CronJob suspend·
      # 스케줄러 이상·02:00에 클러스터가 죽어 있던 경우까지 한 룰로 잡히고,
      # backoffLimit 재시도가 최종 성공하는 경우에 헛발화하지 않는다.
      rules:
        - alert: PlatformBackupStale
          expr: (time() - kube_cronjob_status_last_successful_time{namespace="platform-db", cronjob="platform-backup"}) > 36 * 3600
          for: 30m
          labels:
            severity: critical
          annotations:
            summary: "플랫폼 백업이 36시간 이상 성공하지 못했습니다"
            description: "일 1회 스케줄인데 마지막 성공이 36시간을 넘었습니다. Job 로그를 확인하세요: kubectl get jobs -n platform-db | grep platform-backup. NAS(MinIO) 도달성·자격증명 만료도 함께 점검하세요."

        - alert: PlatformBackupMissing
          # 메트릭 자체가 없는 경우 — CronJob이 삭제됐거나 한 번도 성공하지 못했다.
          # staleness 룰은 series가 없으면 발화하지 않으므로 별도로 잡는다.
          expr: absent(kube_cronjob_status_last_successful_time{namespace="platform-db", cronjob="platform-backup"})
          # 26h — 일 1회 스케줄을 한 번 놓친 뒤에야 발화한다. 최초 설정(자격증명
          # 발급) 중이거나 재구축 직후에 헛발화하지 않도록 여유를 둔 값이다.
          for: 26h
          labels:
            severity: critical
          annotations:
            summary: "플랫폼 백업 CronJob의 성공 이력이 없습니다"
            description: "CronJob이 삭제·suspend되었거나 최초 실행이 아직 성공하지 못했습니다(런북 §14 최초 설정 확인)."

        - alert: PlatformBackupJobFailing
          # CronJob이 만드는 Job 이름은 platform-backup-<epoch> 형태로 결정적이라
          # kube_job_owner 조인 없이 이름 패턴으로 좁힐 수 있다.
          expr: max_over_time(kube_job_status_failed{namespace="platform-db", job_name=~"platform-backup-.*"}[6h]) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "플랫폼 백업 Job에서 실패한 파드가 있습니다"
            description: "재시도로 최종 성공했을 수 있으나 원인을 확인하세요(덤프 실패 / NAS 반출 실패 / checksum 불일치). 최종 실패는 PlatformBackupStale이 별도로 잡습니다."

    - name: platform.scrape
      rules:
        - alert: PlatformTargetDown
          expr: up{namespace=~"platform-.*"} == 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Scrape 대상 다운: {{ $labels.namespace }}/{{ $labels.job }}"
            description: "Prometheus가 10분 이상 해당 타깃을 수집하지 못했습니다. (kube-state-metrics 등 포괄. Loki/Alloy는 on-demand 기동 시)"
